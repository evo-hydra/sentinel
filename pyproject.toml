[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-sentinel"
version = "0.3.4"
description = "Persistent project intelligence & AI code quality gate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Evo Intelligence" }]
keywords = ["ai", "code-quality", "git", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12.0,<1.0",
    "rich>=13.0.0,<15.0",
    "pydantic>=2.10,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.78.0", "openai>=1.0.0"]
mcp = ["mcp>=1.0,<2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
sentinel = "sentinel.cli.app:app"
sentinel-mcp = "sentinel.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM102", "SIM105"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["sentinel"]

[tool.coverage.report]
show_missing = true
fail_under = 85
